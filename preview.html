<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>原型预览入口</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
      background: #f5f5f5;
      padding: 40px 24px;
      max-width: 640px;
      margin: 0 auto;
    }
    h1 { font-size: 22px; margin-bottom: 8px; }
    p { color: #666; font-size: 14px; margin-bottom: 24px; }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .card h2 { font-size: 16px; margin-bottom: 4px; }
    .card span { font-size: 13px; color: #999; }
    .card a {
      display: block;
      margin-top: 10px;
      color: #1677ff;
      font-size: 14px;
      text-decoration: none;
      word-break: break-all;
    }
    .card a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>原型预览入口</h1>
  <p>若某个端口打不开，请换另一个链接，或在 Cursor 中按 Ctrl+P 直接打开对应 index.html。</p>

  <div class="card">
    <h2>搜索页原型</h2>
    <span>搜索页 + 搜索结果页</span>
    <a href="search-prototype/index.html">search-prototype/index.html</a>
  </div>

  <div class="card">
    <h2>壁纸标识原型</h2>
    <span>更换壁纸 · 付费标识</span>
    <a href="wallpaper-labels/index.html">wallpaper-labels/index.html</a>
  </div>

  <div class="card">
    <h2>锁屏付费资源原型</h2>
    <span>购买 / 免费领 / 正在应用</span>
    <a href="lockscreen-prototype/index.html">lockscreen-prototype/index.html</a>
  </div>
</body>
</html>
