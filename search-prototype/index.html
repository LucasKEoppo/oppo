<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>搜索 - 资源搜索原型</title>
  <link rel="stylesheet" href="styles.css?v=12">
</head>
<body>
  <div class="phone-frame">
    <div id="page-search" class="page active">

      <!-- 搜索栏 -->
      <header class="search-header">
        <button class="btn-back" id="btn-back" aria-label="返回">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 6l-6 6 6 6"/>
          </svg>
        </button>
        <div class="search-bar">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2">
            <circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/>
          </svg>
          <input type="text" id="search-input" class="search-input" placeholder="搜索在线壁纸" autocomplete="off">
          <button class="btn-clear-input hidden" id="btn-clear-input" aria-label="清除">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="#999">
              <circle cx="12" cy="12" r="10" fill="#ccc"/>
              <path d="M9 9l6 6M15 9l-6 6" stroke="#fff" stroke-width="2"/>
            </svg>
          </button>
          <button class="btn-search" id="btn-search">搜索</button>
        </div>
      </header>

      <!-- 搜索历史 -->
      <section class="section" id="section-history">
        <div class="section-header">
          <h2 class="section-title">搜索历史</h2>
          <button class="btn-icon" id="btn-clear-history" aria-label="清空历史">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="1.8">
              <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>
            </svg>
          </button>
        </div>
        <div class="tag-list" id="history-list"></div>
      </section>

      <!-- 热门搜索 -->
      <section class="section">
        <div class="section-header">
          <h2 class="section-title">热门搜索</h2>
          <button class="btn-icon" id="btn-refresh-hot" aria-label="换一批">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="1.8">
              <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
              <path d="M21 3v6h-6"/>
            </svg>
          </button>
        </div>
        <div class="tag-list tag-list-hot" id="hot-list"></div>
      </section>

    </div>
  </div>

  <script type="module" src="app.js?v=14"></script>
</body>
</html>
