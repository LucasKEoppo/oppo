<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>搜索 - 资源搜索原型</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="phone-frame">
    <div id="page-search" class="page active">

      <!-- 搜索栏 -->
      <header class="search-header">
        <button class="btn-back" id="btn-back" aria-label="返回">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 6l-6 6 6 6"/>
          </svg>
        </button>
        <div class="search-bar">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2">
            <circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/>
          </svg>
          <input type="text" id="search-input" class="search-input" autocomplete="off">
          <button class="btn-search" id="btn-search">搜索</button>
        </div>
      </header>

      <!-- 历史搜索 -->
      <section class="section">
        <div class="section-header">
          <h2 class="section-title">历史搜索</h2>
          <button class="btn-clear-history" id="btn-clear-history" aria-label="清空历史">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="1.8">
              <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>
            </svg>
          </button>
        </div>
        <div class="tag-list" id="history-list"></div>
      </section>

      <!-- 热门搜索 -->
      <section class="section">
        <div class="section-header">
          <h2 class="section-title">热门搜索</h2>
          <button class="btn-more" aria-label="更多">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#999">
              <circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/>
            </svg>
          </button>
        </div>
        <div class="hot-grid" id="hot-grid"></div>
      </section>

    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
