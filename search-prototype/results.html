<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>搜索结果 - 资源搜索原型</title>
  <link rel="stylesheet" href="styles.css?v=24">
</head>
<body>
  <div class="phone-frame">
    <div id="page-results" class="page active">

      <!-- 搜索栏 -->
      <header class="search-header">
        <button class="btn-back" id="btn-back" aria-label="返回">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 6l-6 6 6 6"/>
          </svg>
        </button>
        <div class="search-bar">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2">
            <circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/>
          </svg>
          <input type="text" id="search-input" class="search-input" autocomplete="off">
          <button class="btn-clear-input hidden" id="btn-clear-input" aria-label="清除">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="#999">
              <circle cx="12" cy="12" r="10" fill="#ccc"/>
              <path d="M9 9l6 6M15 9l-6 6" stroke="#fff" stroke-width="2"/>
            </svg>
          </button>
          <span class="search-divider"></span>
          <button class="btn-search" id="btn-search">搜索</button>
        </div>
      </header>

      <!-- 搜索结果网格 -->
      <div class="results-grid" id="results-grid"></div>

    </div>
  </div>

  <script type="module" src="results.js?v=24"></script>
</body>
</html>
