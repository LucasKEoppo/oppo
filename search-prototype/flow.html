<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>独立入口搜索 · 交互流程图</title>
  <link rel="stylesheet" href="flow.css">
</head>
<body>
  <div class="board">
    <header class="board-header">
      <h1>独立入口资源列表搜索 · 交互流程</h1>
      <p>每一步为真实原型截图；箭头标注用户操作。结果页无下载按钮。</p>
    </header>

    <section class="section">
      <h2 class="section-title">① 独立入口 → 搜索 → 结果</h2>
      <div class="story">
        <figure class="step">
          <a class="phone" href="../wallpaper-labels/index.html">
            <img src="flow-assets/00-list.png" alt="独立入口">
          </a>
          <figcaption>资源独立入口</figcaption>
        </figure>
        <div class="action">
          <span class="action-label">上滑 · 点搜索</span>
        </div>
        <figure class="step">
          <a class="phone" href="index.html">
            <img src="flow-assets/01-entry.png" alt="搜索页">
          </a>
          <figcaption>搜索页</figcaption>
        </figure>
        <div class="action">
          <span class="action-label">发起搜索</span>
        </div>
        <figure class="step">
          <a class="phone" href="results.html?type=wallpaper&q=%E7%AE%80%E7%BA%A6">
            <img src="flow-assets/02-results.png" alt="搜索结果">
          </a>
          <figcaption>搜索结果（无下载）</figcaption>
        </figure>
      </div>
    </section>

    <section class="section paid">
      <h2 class="section-title">② 点在线资源 → 商店完成购买与应用</h2>
      <div class="story">
        <figure class="step">
          <a class="phone" href="results.html?type=wallpaper&q=%E7%AE%80%E7%BA%A6">
            <img src="flow-assets/02-results.png" alt="点在线资源">
          </a>
          <figcaption>点击在线资源</figcaption>
        </figure>
        <div class="action">
          <span class="action-label">跳转商店</span>
        </div>
        <figure class="step">
          <a class="phone" href="../wallpaper-labels/store-detail.html?id=qc-1">
            <img src="flow-assets/03-store.png" alt="商店详情">
          </a>
          <figcaption>主题商店详情</figcaption>
        </figure>
        <div class="action">
          <span class="action-label">购买与应用</span>
        </div>
        <figure class="step">
          <a class="phone" href="../wallpaper-labels/edit.html?id=qc-1&unlocked=1">
            <img src="flow-assets/04-apply.png" alt="完成">
          </a>
          <figcaption>完成购买与应用</figcaption>
        </figure>
      </div>
    </section>

    <footer class="board-footer">
      <span>点击任一原型图可进入对应页面体验</span>
      <div class="links">
        <a href="index.html">搜索入口</a>
        <a href="results.html?type=wallpaper&q=%E7%AE%80%E7%BA%A6">搜索结果</a>
        <a href="../wallpaper-labels/store-detail.html?id=qc-1">商店详情</a>
        <a href="../flows.html">全部流程</a>
      </div>
    </footer>
  </div>
</body>
</html>
