<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>主题商店资源详情</title>
  <link rel="stylesheet" href="store-detail.css">
</head>
<body>
  <div class="phone-frame">
    <header class="store-header">
      <button type="button" class="btn-icon" id="btn-back" aria-label="返回">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 6l-6 6 6 6"/>
        </svg>
      </button>
      <button type="button" class="btn-icon" aria-label="搜索">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"/>
          <path d="M20 20l-3.5-3.5"/>
        </svg>
      </button>
    </header>

    <main class="store-body">
      <div class="preview-block">
        <div class="preview-art" id="preview-art">
          <div class="preview-face" aria-hidden="true"></div>
          <div class="preview-pet" aria-hidden="true">
            <span class="pet-tag">免费领宠</span>
          </div>
        </div>
        <div class="preview-clock-wrap">
          <div class="preview-clock">12:34</div>
          <div class="preview-meta"># 深邃暗夜黑曜 &gt; 2022/05/11 WED</div>
        </div>
      </div>

      <div class="vip-banner">
        <div class="vip-mark">V</div>
        <div class="vip-copy">
          <p class="vip-title">VIP首开送装扮</p>
          <p class="vip-sub">该装扮永久可用</p>
        </div>
        <button type="button" class="btn-vip">去开通</button>
      </div>

      <div class="resource-info">
        <p class="resource-title">主题 <span id="resource-name">little emoji</span> &gt;</p>
        <p class="resource-price">
          <span>6.0 可币</span>
          <span class="vip-free">VIP 免费</span>
        </p>
      </div>
    </main>

    <footer class="store-footer">
      <button type="button" class="footer-side">
        <span class="side-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M12 3.5l2.4 4.9 5.4.8-3.9 3.8.9 5.4L12 15.8 7.2 18.4l.9-5.4L4.2 9.2l5.4-.8L12 3.5z"/>
          </svg>
        </span>
        <span>4.4万</span>
      </button>
      <button type="button" class="footer-side">
        <span class="side-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M8 7h8l1.5 3H21v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-9h3.5L8 7z"/>
            <path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7"/>
          </svg>
        </span>
        <span>试用</span>
      </button>
      <button type="button" class="btn-buy" id="btn-buy">购买</button>
      <button type="button" class="btn-free" id="btn-free">免费领</button>
    </footer>

    <!-- 购买确认（简化完成购买） -->
    <div id="modal-buy" class="modal-overlay hidden">
      <div class="buy-sheet">
        <h2 class="buy-title">确认购买</h2>
        <p class="buy-desc">支付 <strong>6.0 可币</strong> 购买该主题，购买后可返回编辑页应用。</p>
        <div class="buy-actions">
          <button type="button" class="btn-sheet-cancel" id="btn-buy-cancel">取消</button>
          <button type="button" class="btn-sheet-confirm" id="btn-buy-confirm">确认购买</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="store-detail.js"></script>
</body>
</html>
