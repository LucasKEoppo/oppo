<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>壁纸资源详情</title>
  <link rel="stylesheet" href="detail.css">
</head>
<body>
  <div class="phone-frame">
    <div class="detail-hero" id="detail-hero"></div>

    <button type="button" class="btn-back" id="btn-back" aria-label="返回">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <path d="M15 6l-6 6 6 6"/>
      </svg>
    </button>

    <footer class="detail-footer">
      <div class="recommend-scroll" id="recommend-list"></div>
      <button type="button" class="btn-set" id="btn-set">
        <!-- 魔法棒：实心五角星 + 右下斜向短手柄 -->
        <svg class="set-icon" viewBox="0 0 24 24" aria-hidden="true">
          <g fill="currentColor" transform="translate(11.2 9.2) rotate(-18) translate(-11.2 -9.2)">
            <path d="M11.2 2.4l2.05 4.55 4.95.5-3.75 3.3 1.1 4.85-4.35-2.55-4.35 2.55 1.1-4.85-3.75-3.3 4.95-.5L11.2 2.4z"/>
          </g>
          <path d="M13.6 12.8c.2-.25.6-.25.8 0l5.35 6.55c.35.45.25 1.1-.25 1.35-.45.25-1.05.05-1.3-.4L13.55 13.8c-.2-.3-.15-.7.05-1z"/>
        </svg>
        <span>设为</span>
      </button>
    </footer>
  </div>

  <script type="module" src="detail.js"></script>
</body>
</html>
