<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>壁纸独立入口 · 交互流程图</title>
  <link rel="stylesheet" href="flow.css">
</head>
<body>
  <div class="board">
    <header class="board-header">
      <h1>壁纸资源独立入口 · 交互流程</h1>
      <p>每一步为真实原型截图；箭头标注用户操作。点击「设为」后先选择应用范围，再进入编辑框架。</p>
    </header>

    <section class="section">
      <h2 class="section-title">① 公共路径：列表 → 详情 → 选择范围 → 编辑</h2>
      <div class="story">
        <figure class="step">
          <a class="phone" href="#">
            <img src="flow-assets/01-list.png" alt="壁纸列表">
          </a>
          <figcaption>壁纸列表</figcaption>
        </figure>
        <div class="action">
          <span class="action-label">点击资源，不下载，展示缩略图</span>
        </div>
        <figure class="step">
          <a class="phone" href="#">
            <img src="flow-assets/02-detail.png" alt="资源详情">
          </a>
          <figcaption>资源详情页</figcaption>
        </figure>
        <div class="action">
          <span class="action-label">点击「设为」</span>
        </div>
        <figure class="step">
          <a class="phone" href="#">
            <img src="flow-assets/02b-apply-scope.png" alt="选择应用范围">
          </a>
          <figcaption>选择壁纸应用范围</figcaption>
        </figure>
        <div class="action">
          <span class="action-label">选择范围</span>
        </div>
        <figure class="step">
          <a class="phone" href="#">
            <img src="flow-assets/03-edit-paid.png" alt="锁屏编辑框架">
          </a>
          <figcaption>锁屏编辑框架</figcaption>
        </figure>
      </div>
    </section>

    <section class="section free">
      <h2 class="section-title">② 免费资源：直接应用</h2>
      <div class="story">
        <figure class="step">
          <a class="phone" href="#">
            <img src="flow-assets/03-edit-free.png" alt="编辑页-免费">
          </a>
          <figcaption>编辑页（免费）</figcaption>
        </figure>
        <div class="action">
          <span class="action-label">点击「应用」</span>
        </div>
        <figure class="step">
          <a class="phone" href="#">
            <img src="flow-assets/04-applying.png" alt="正在应用">
          </a>
          <figcaption>正在应用...</figcaption>
        </figure>
      </div>
    </section>

    <section class="section paid">
      <h2 class="section-title">③ 付费资源：购买后再应用</h2>
      <div class="story">
        <figure class="step">
          <a class="phone" href="#">
            <img src="flow-assets/03-edit-paid.png" alt="编辑页-付费未购">
          </a>
          <figcaption>编辑页（付费未购）</figcaption>
        </figure>
        <div class="action">
          <span class="action-label">点击「应用」</span>
        </div>
        <figure class="step">
          <a class="phone" href="#">
            <img src="flow-assets/05-purchase-hint.png" alt="购买后即可使用">
          </a>
          <figcaption>购买后即可使用</figcaption>
        </figure>
        <div class="action">
          <span class="action-label">点击「去购买」</span>
        </div>
        <figure class="step">
          <a class="phone" href="#">
            <img src="flow-assets/06-store.png" alt="主题商店详情">
          </a>
          <figcaption>主题商店详情</figcaption>
        </figure>
      </div>

      <div class="story story-continue">
        <figure class="step">
          <a class="phone" href="#">
            <img src="flow-assets/06-store.png" alt="完成购买">
          </a>
          <figcaption>完成购买 / 免费领</figcaption>
        </figure>
        <div class="action">
          <span class="action-label">返回编辑</span>
        </div>
        <figure class="step">
          <a class="phone" href="#">
            <img src="flow-assets/07-edit-unlocked.png" alt="已解锁编辑页">
          </a>
          <figcaption>编辑页（已解锁）</figcaption>
        </figure>
        <div class="action">
          <span class="action-label">再次「应用」</span>
        </div>
        <figure class="step">
          <a class="phone" href="#">
            <img src="flow-assets/08-apply-after-buy.png" alt="购买后正在应用">
          </a>
          <figcaption>正在应用...</figcaption>
        </figure>
      </div>
    </section>

    <footer class="board-footer">
      <span>点击任一原型图可进入对应页面体验</span>
      <div class="links"><a href="../index.html">返回总览</a></div>
    </footer>
  </div>
</body>
</html>
