<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2. 主题资源独立入口 · 交互流程图</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="board">
    <a class="back-link" href="flow.html">← 返回总览</a>
    <header class="board-header">
      <h1>主题资源独立入口 · 交互流程</h1>
      <p>每一步为真实原型截图；箭头标注用户操作</p>
    </header>

    <section class="section">
      <h2 class="section-title">① 公共路径：下载进入编辑</h2>
      <div class="story">
        <figure class="step">
          <a class="phone" href="../theme-list-prototype/index.html">
            <img src="assets/theme-list.png" alt="主题列表">
          </a>
          <figcaption>主题列表</figcaption>
        </figure>
        <div class="action"><span class="action-label">点击下载</span></div>
        <figure class="step">
          <a class="phone" href="../theme-list-prototype/index.html">
            <img src="assets/theme-downloading.png" alt="下载进度">
          </a>
          <figcaption>下载进度</figcaption>
        </figure>
        <div class="action"><span class="action-label">下载完成</span></div>
        <figure class="step">
          <a class="phone" href="../theme-list-prototype/edit.html?id=lc-1">
            <img src="assets/theme-edit-paid.png" alt="编辑框架">
          </a>
          <figcaption>锁屏编辑框架</figcaption>
        </figure>
      </div>
    </section>

    <section class="section free">
      <h2 class="section-title">② 免费资源：直接应用</h2>
      <div class="story">
        <figure class="step">
          <a class="phone" href="../theme-list-prototype/edit.html?id=lc-2">
            <img src="assets/theme-edit-free.png" alt="免费编辑">
          </a>
          <figcaption>编辑页（免费）</figcaption>
        </figure>
        <div class="action"><span class="action-label">点击「应用」</span></div>
        <figure class="step">
          <a class="phone" href="../theme-list-prototype/edit.html?id=lc-2">
            <img src="assets/theme-applying.png" alt="正在应用">
          </a>
          <figcaption>正在应用...</figcaption>
        </figure>
      </div>
    </section>

    <section class="section paid">
      <h2 class="section-title">③ 付费资源：购买后再应用</h2>
      <div class="story">
        <figure class="step">
          <a class="phone" href="../theme-list-prototype/edit.html?id=lc-1">
            <img src="assets/theme-edit-paid.png" alt="付费编辑">
          </a>
          <figcaption>编辑页（付费未购）</figcaption>
        </figure>
        <div class="action"><span class="action-label">点击「应用」</span></div>
        <figure class="step">
          <a class="phone" href="../theme-list-prototype/edit.html?id=lc-1">
            <img src="assets/theme-purchase-hint.png" alt="购买后即可使用">
          </a>
          <figcaption>购买后即可使用</figcaption>
        </figure>
        <div class="action"><span class="action-label">点击「去购买」</span></div>
        <figure class="step">
          <a class="phone" href="../theme-list-prototype/store-detail.html?id=lc-1">
            <img src="assets/theme-store.png" alt="商店详情">
          </a>
          <figcaption>主题商店详情</figcaption>
        </figure>
      </div>
      <div class="story story-continue">
        <figure class="step">
          <a class="phone" href="../theme-list-prototype/store-detail.html?id=lc-1">
            <img src="assets/theme-store.png" alt="完成购买">
          </a>
          <figcaption>完成购买 / 免费领</figcaption>
        </figure>
        <div class="action"><span class="action-label">返回编辑</span></div>
        <figure class="step">
          <a class="phone" href="../theme-list-prototype/edit.html?id=lc-1&unlocked=1">
            <img src="assets/theme-edit-unlocked.png" alt="已解锁">
          </a>
          <figcaption>编辑页（已解锁）</figcaption>
        </figure>
        <div class="action"><span class="action-label">再次「应用」</span></div>
        <figure class="step">
          <a class="phone" href="../theme-list-prototype/edit.html?id=lc-1&unlocked=1">
            <img src="assets/theme-apply-after-buy.png" alt="正在应用">
          </a>
          <figcaption>正在应用...</figcaption>
        </figure>
      </div>
    </section>

    <footer class="board-footer">
      <span>点击任一原型图可进入对应页面体验</span>
      <div class="links">
        <a href="../theme-list-prototype/index.html">主题列表</a>
        <a href="../theme-list-prototype/edit.html?id=lc-2">编辑(免费)</a>
        <a href="../theme-list-prototype/edit.html?id=lc-1">编辑(付费)</a>
        <a href="../theme-list-prototype/store-detail.html?id=lc-1">商店详情</a>
        <a href="../theme-list-prototype/flow.html">同款主题流程页</a>
        <a href="01-wallpaper-entry.html">← 上一条</a>
        <a href="03-change-wallpaper.html">下一条 →</a>
      </div>
    </footer>
  </div>
</body>
</html>
