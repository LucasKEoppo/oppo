<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1. 壁纸资源独立入口应用流程</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="board">
    <a class="back-link" href="index.html">← 返回总览</a>
    <header class="board-header">
      <h1>1. 壁纸资源独立入口应用流程</h1>
      <p>对应：进入壁纸独立入口 → 详情「设为」→ 编辑框架「应用」；付费需购买后返回再应用。</p>
    </header>

    <section class="section">
      <h2 class="section-title">① 公共路径：列表 → 详情 → 编辑</h2>
      <div class="story">
        <figure class="step">
          <a class="phone" href="../wallpaper-labels/index.html"><img src="assets/wp-list.png" alt="壁纸列表"></a>
          <figcaption>壁纸独立入口列表</figcaption>
        </figure>
        <div class="action"><span class="action-label">点击资源</span></div>
        <figure class="step">
          <a class="phone" href="../wallpaper-labels/detail.html?id=qc-1"><img src="assets/wp-detail-paid.png" alt="资源详情"></a>
          <figcaption>资源详情页</figcaption>
        </figure>
        <div class="action"><span class="action-label">点击「设为」</span></div>
        <figure class="step">
          <a class="phone" href="../wallpaper-labels/edit.html?id=qc-1"><img src="assets/wp-edit-paid.png" alt="编辑框架"></a>
          <figcaption>锁屏编辑框架</figcaption>
        </figure>
      </div>
    </section>

    <section class="section free">
      <h2 class="section-title">② 免费 / 已解锁：直接应用</h2>
      <div class="story">
        <figure class="step">
          <a class="phone" href="../wallpaper-labels/edit.html?id=sz-1"><img src="assets/wp-edit-free.png" alt="免费编辑"></a>
          <figcaption>编辑页（免费）</figcaption>
        </figure>
        <div class="action"><span class="action-label">点击「应用」</span></div>
        <figure class="step">
          <a class="phone" href="../wallpaper-labels/edit.html?id=sz-1"><img src="assets/wp-applying.png" alt="正在应用"></a>
          <figcaption>正在应用… → 成功</figcaption>
        </figure>
      </div>
    </section>

    <section class="section paid">
      <h2 class="section-title">③ 未解锁付费：购买后再应用</h2>
      <div class="story">
        <figure class="step">
          <a class="phone" href="../wallpaper-labels/edit.html?id=qc-1"><img src="assets/wp-edit-paid.png" alt="付费编辑"></a>
          <figcaption>编辑页（付费未购）</figcaption>
        </figure>
        <div class="action"><span class="action-label">点击「应用」</span></div>
        <figure class="step">
          <a class="phone" href="../wallpaper-labels/edit.html?id=qc-1"><img src="assets/wp-purchase-hint.png" alt="付费提示"></a>
          <figcaption>购买后即可使用<br>（该壁纸是主题商店付费资源）</figcaption>
        </figure>
        <div class="action"><span class="action-label">去购买</span></div>
        <figure class="step">
          <a class="phone" href="../wallpaper-labels/store-detail.html?id=qc-1"><img src="assets/wp-store.png" alt="商店详情"></a>
          <figcaption>主题商店资源详情</figcaption>
        </figure>
      </div>
      <div class="story story-continue">
        <figure class="step">
          <a class="phone" href="../wallpaper-labels/store-detail.html?id=qc-1"><img src="assets/wp-store.png" alt="购买"></a>
          <figcaption>完成购买 / 免费领</figcaption>
        </figure>
        <div class="action"><span class="action-label">返回编辑</span></div>
        <figure class="step">
          <a class="phone" href="../wallpaper-labels/edit.html?id=qc-1&unlocked=1"><img src="assets/wp-edit-unlocked.png" alt="已解锁"></a>
          <figcaption>编辑页（已解锁）</figcaption>
        </figure>
        <div class="action"><span class="action-label">再次「应用」</span></div>
        <figure class="step">
          <a class="phone" href="../wallpaper-labels/edit.html?id=qc-1&unlocked=1"><img src="assets/wp-apply-after-buy.png" alt="应用成功"></a>
          <figcaption>正在应用… → 成功</figcaption>
        </figure>
      </div>
    </section>

    <footer class="board-footer">
      <span>点击截图可进入对应原型页体验</span>
      <div class="links">
        <a href="02-theme-entry.html">下一条：主题独立入口 →</a>
      </div>
    </footer>
  </div>
</body>
</html>
