<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1. 壁纸资源独立入口 · 交互流程图</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="board">
    <a class="back-link" href="flow.html">← 返回总览</a>
    <header class="board-header">
      <h1>壁纸资源独立入口 · 交互流程</h1>
      <p>每一步为真实原型截图；箭头标注用户操作。点击「设为」后先选择应用范围，再进入编辑框架。</p>
    </header>

    <section class="section">
      <h2 class="section-title">① 公共路径：列表 → 详情 → 选择范围 → 编辑</h2>
      <div class="story">
        <figure class="step">
          <a class="phone" href="../wallpaper-labels/index.html">
            <img src="assets/wp-list.png" alt="壁纸列表">
          </a>
          <figcaption>壁纸独立入口列表</figcaption>
        </figure>
        <div class="action"><span class="action-label wrap">点击资源，不下载，展示缩略图</span></div>
        <figure class="step">
          <a class="phone" href="../wallpaper-labels/detail.html?id=qc-1">
            <img src="assets/wp-detail-paid.png" alt="资源详情">
          </a>
          <figcaption>资源详情页</figcaption>
        </figure>
        <div class="action"><span class="action-label">点击「设为」</span></div>
        <figure class="step">
          <a class="phone" href="../wallpaper-labels/apply-scope.html?id=qc-1">
            <img src="assets/02b-apply-scope.png" alt="选择应用范围">
          </a>
          <figcaption>选择壁纸应用范围</figcaption>
        </figure>
        <div class="action"><span class="action-label">选择范围</span></div>
        <figure class="step">
          <a class="phone" href="../wallpaper-labels/edit.html?id=qc-1&scope=lock">
            <img src="assets/wp-edit-paid.png" alt="编辑框架">
          </a>
          <figcaption>锁屏编辑框架</figcaption>
        </figure>
      </div>
    </section>

    <section class="section free">
      <h2 class="section-title">② 免费资源：直接应用</h2>
      <div class="story">
        <figure class="step">
          <a class="phone" href="../wallpaper-labels/edit.html?id=sz-1">
            <img src="assets/wp-edit-free.png" alt="免费编辑">
          </a>
          <figcaption>编辑页（免费）</figcaption>
        </figure>
        <div class="action"><span class="action-label">点击「应用」</span></div>
        <figure class="step">
          <a class="phone" href="../wallpaper-labels/edit.html?id=sz-1">
            <img src="assets/wp-applying.png" alt="正在应用">
          </a>
          <figcaption>正在应用...</figcaption>
        </figure>
      </div>
    </section>

    <section class="section paid">
      <h2 class="section-title">③ 付费资源：购买后再应用</h2>
      <div class="story">
        <figure class="step">
          <a class="phone" href="../wallpaper-labels/edit.html?id=qc-1">
            <img src="assets/wp-edit-paid.png" alt="付费编辑">
          </a>
          <figcaption>编辑页（付费未购）</figcaption>
        </figure>
        <div class="action"><span class="action-label">点击「应用」</span></div>
        <figure class="step">
          <a class="phone" href="../wallpaper-labels/edit.html?id=qc-1">
            <img src="assets/wp-purchase-hint.png" alt="购买后即可使用">
          </a>
          <figcaption>购买后即可使用</figcaption>
        </figure>
        <div class="action"><span class="action-label">点击「去购买」</span></div>
        <figure class="step">
          <a class="phone" href="../wallpaper-labels/store-detail.html?id=qc-1">
            <img src="assets/wp-store.png" alt="商店详情">
          </a>
          <figcaption>主题商店详情</figcaption>
        </figure>
      </div>
      <div class="story story-continue">
        <figure class="step">
          <a class="phone" href="../wallpaper-labels/store-detail.html?id=qc-1">
            <img src="assets/wp-store.png" alt="完成购买">
          </a>
          <figcaption>完成购买 / 免费领</figcaption>
        </figure>
        <div class="action"><span class="action-label">返回编辑</span></div>
        <figure class="step">
          <a class="phone" href="../wallpaper-labels/edit.html?id=qc-1&unlocked=1">
            <img src="assets/wp-edit-unlocked.png" alt="已解锁">
          </a>
          <figcaption>编辑页（已解锁）</figcaption>
        </figure>
        <div class="action"><span class="action-label">再次「应用」</span></div>
        <figure class="step">
          <a class="phone" href="../wallpaper-labels/edit.html?id=qc-1&unlocked=1">
            <img src="assets/wp-apply-after-buy.png" alt="正在应用">
          </a>
          <figcaption>正在应用...</figcaption>
        </figure>
      </div>
    </section>

    <footer class="board-footer">
      <span>点击任一原型图可进入对应页面体验</span>
      <div class="links">
        <a href="../wallpaper-labels/index.html">壁纸列表</a>
        <a href="../wallpaper-labels/detail.html?id=qc-1">资源详情</a>
        <a href="../wallpaper-labels/edit.html?id=sz-1">编辑(免费)</a>
        <a href="../wallpaper-labels/edit.html?id=qc-1">编辑(付费)</a>
        <a href="../wallpaper-labels/store-detail.html?id=qc-1">商店详情</a>
        <a href="02-theme-entry.html">下一条 →</a>
      </div>
    </footer>
  </div>
</body>
</html>
