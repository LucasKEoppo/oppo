<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5. 编辑框架内搜索流程</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="board">
    <a class="back-link" href="index.html">← 返回总览</a>
    <header class="board-header">
      <h1>5. 编辑框架内搜索流程</h1>
      <p>对应：更换壁纸页/编辑场景进入搜索 → 点在线资源回编辑框架 →「应用」时做购买状态校验；付费走商店购买后再应用。</p>
    </header>

    <section class="section search">
      <h2 class="section-title">① 编辑场景进入搜索并选资源</h2>
      <div class="story">
        <figure class="step">
          <a class="phone" href="../wallpaper-labels/index.html"><img src="assets/wp-list.png" alt="更换壁纸"></a>
          <figcaption>进入更换壁纸页</figcaption>
        </figure>
        <div class="action"><span class="action-label">上滑 · 点搜索</span></div>
        <figure class="step">
          <a class="phone" href="../search-prototype/index.html"><img src="assets/search-entry.png" alt="搜索页"></a>
          <figcaption>进入搜索页</figcaption>
        </figure>
        <div class="action"><span class="action-label">发起搜索</span></div>
        <figure class="step">
          <a class="phone" href="../search-prototype/results.html?type=wallpaper&q=简约"><img src="assets/search-results.png" alt="结果"></a>
          <figcaption>展示搜索结果<br>（无下载按钮）</figcaption>
        </figure>
        <div class="action"><span class="action-label">点在线资源</span></div>
        <figure class="step">
          <a class="phone" href="../wallpaper-labels/edit.html?id=qc-1"><img src="assets/wp-edit-paid.png" alt="回编辑"></a>
          <figcaption>进入编辑框架<br>（带回壁纸路径）</figcaption>
        </figure>
      </div>
    </section>

    <section class="section free">
      <h2 class="section-title">② 免费 / 已解锁：应用成功</h2>
      <div class="story">
        <figure class="step">
          <a class="phone" href="../wallpaper-labels/edit.html?id=sz-1"><img src="assets/wp-edit-free.png" alt="免费"></a>
          <figcaption>编辑框架</figcaption>
        </figure>
        <div class="action"><span class="action-label">点击「应用」</span></div>
        <figure class="step">
          <a class="phone" href="../wallpaper-labels/edit.html?id=sz-1"><img src="assets/wp-applying.png" alt="成功"></a>
          <figcaption>购买校验通过 · 应用成功</figcaption>
        </figure>
      </div>
    </section>

    <section class="section paid">
      <h2 class="section-title">③ 未解锁付费：弹窗 → 商店 → 再应用</h2>
      <div class="story">
        <figure class="step">
          <a class="phone" href="../wallpaper-labels/edit.html?id=qc-1"><img src="assets/wp-edit-paid.png" alt="付费"></a>
          <figcaption>用户点击「应用」</figcaption>
        </figure>
        <div class="action"><span class="action-label">校验未通过</span></div>
        <figure class="step">
          <a class="phone" href="../wallpaper-labels/edit.html?id=qc-1"><img src="assets/wp-purchase-hint.png" alt="弹窗"></a>
          <figcaption>弹窗提示为主题商店付费资源</figcaption>
        </figure>
        <div class="action"><span class="action-label">去购买</span></div>
        <figure class="step">
          <a class="phone" href="../wallpaper-labels/store-detail.html?id=qc-1"><img src="assets/wp-store.png" alt="商店"></a>
          <figcaption>商店详情 · 做任务/VIP/单购</figcaption>
        </figure>
      </div>
      <div class="story story-continue">
        <figure class="step">
          <a class="phone" href="../wallpaper-labels/edit.html?id=qc-1&unlocked=1"><img src="assets/wp-edit-unlocked.png" alt="校验通过"></a>
          <figcaption>购买成功 · 校验通过</figcaption>
        </figure>
        <div class="action"><span class="action-label">再次「应用」</span></div>
        <figure class="step">
          <a class="phone" href="../wallpaper-labels/edit.html?id=qc-1&unlocked=1"><img src="assets/wp-apply-after-buy.png" alt="成功"></a>
          <figcaption>应用成功</figcaption>
        </figure>
      </div>
    </section>

    <footer class="board-footer">
      <span>点击截图可进入对应原型页体验</span>
      <div class="links">
        <a href="04-search-independent.html">← 上一条</a>
        <a href="index.html">返回总览</a>
      </div>
    </footer>
  </div>
</body>
</html>
