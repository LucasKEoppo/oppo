<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4. 独立入口资源列表搜索流程</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="board">
    <a class="back-link" href="index.html">← 返回总览</a>
    <header class="board-header">
      <h1>4. 独立入口资源列表搜索流程</h1>
      <p>对应：独立入口上滑露出搜索 → 搜索页发起搜索 → 按资源类型筛结果 → 点在线资源跳转主题商店详情完成购买与应用。结果页<strong>无下载按钮</strong>。</p>
    </header>

    <section class="section search">
      <h2 class="section-title">个性化设置侧</h2>
      <div class="story">
        <figure class="step">
          <a class="phone" href="../wallpaper-labels/index.html"><img src="assets/wp-list.png" alt="独立入口"></a>
          <figcaption>进入资源独立入口</figcaption>
        </figure>
        <div class="action"><span class="action-label">上滑 · 点搜索</span></div>
        <figure class="step">
          <a class="phone" href="../search-prototype/index.html"><img src="assets/search-entry.png" alt="搜索页"></a>
          <figcaption>进入搜索页</figcaption>
        </figure>
        <div class="action"><span class="action-label">发起搜索</span></div>
        <figure class="step">
          <a class="phone" href="../search-prototype/results.html?type=wallpaper&q=简约"><img src="assets/search-results.png" alt="搜索结果"></a>
          <figcaption>展示搜索结果<br>（按壁纸类型筛选 · 无下载按钮）</figcaption>
        </figure>
      </div>
    </section>

    <section class="section paid">
      <h2 class="section-title">主题商店侧</h2>
      <div class="story">
        <figure class="step">
          <a class="phone" href="../search-prototype/results.html?type=wallpaper&q=简约"><img src="assets/search-results.png" alt="点在线资源"></a>
          <figcaption>点击在线资源</figcaption>
        </figure>
        <div class="action"><span class="action-label">跳转商店</span></div>
        <figure class="step">
          <a class="phone" href="../wallpaper-labels/store-detail.html?id=qc-1"><img src="assets/wp-store.png" alt="商店详情"></a>
          <figcaption>主题商店资源详情页</figcaption>
        </figure>
        <div class="action"><span class="action-label">购买与应用</span></div>
        <figure class="step">
          <a class="phone" href="../wallpaper-labels/edit.html?id=qc-1&unlocked=1"><img src="assets/wp-apply-after-buy.png" alt="完成"></a>
          <figcaption>完成购买与应用 · 流程结束</figcaption>
        </figure>
      </div>
    </section>

    <footer class="board-footer">
      <span>点击截图可进入对应原型页体验</span>
      <div class="links">
        <a href="03-change-wallpaper.html">← 上一条</a>
        <a href="05-search-in-edit.html">下一条：编辑框架内搜索 →</a>
      </div>
    </footer>
  </div>
</body>
</html>
