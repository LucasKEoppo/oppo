<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>需先获取资源 · 全屏原型</title>
  <link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
  <div class="phone-frame">
    <div class="screen">
      <header class="header">
        <button class="btn-close" type="button" aria-label="返回">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 6l-6 6 6 6"/>
          </svg>
        </button>
        <h1 class="title">需先获取以下资源</h1>
        <span class="header-spacer" aria-hidden="true"></span>
      </header>

      <main class="body">
        <section class="resource-card">
          <div class="thumb" aria-hidden="true" style="background: linear-gradient(165deg, #0D47A1 0%, #1976D2 50%, #64B5F6 100%);"></div>
          <div class="resource-meta">
            <h2 class="resource-type">壁纸</h2>
            <p class="resource-name">神烦鸟 整理仪表</p>
            <p class="resource-price">
              <span class="price-num">1.0</span>
              <span class="price-unit">可币</span>
              <span class="vip-tag">VIP 免费</span>
            </p>
          </div>
        </section>

        <section class="vip-row">
          <p class="vip-text">
            开通VIP
            <strong>¥4</strong>
            <span class="vip-origin">¥15/月</span>
          </p>
          <button class="btn-vip" type="button">立即开通</button>
        </section>

        <button class="option-card" type="button">
          <div class="option-text">
            <span class="option-title">直接购买</span>
            <span class="option-desc">购买后资源永久有效</span>
          </div>
          <div class="option-aside">
            <span class="option-price">¥1.0</span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M9 6l6 6-6 6"/>
            </svg>
          </div>
        </button>

        <button class="option-card coin-exchange-card" type="button">
          <div class="option-text">
            <span class="option-title">金币兑换</span>
            <span class="option-desc">做任务免费获取资源</span>
            <div class="coin-cost-row">
              <span class="coin-cost-now">100</span>
              <span class="coin-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="16" height="16">
                  <circle cx="12" cy="12" r="11" fill="#F5A623"/>
                  <circle cx="12" cy="12" r="8.5" fill="#FFD54F"/>
                  <text x="12" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#C47A00">币</text>
                </svg>
              </span>
              <span class="coin-cost-origin">100</span>
            </div>
          </div>
          <span class="btn-exchange">兑换</span>
        </button>
      </main>
    </div>
  </div>
</body>
</html>
